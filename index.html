<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bel Sekolah Online</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    #clock { font-size: 48px; margin-bottom: 20px; }
    table { border-collapse: collapse; margin:auto; }
    th, td { border:1px solid #ccc; padding:8px; }
  </style>
</head>
<body>
  <h1>Jam WIB Terkini</h1>
  <div id="clock"></div>

  <h2>Jadwal Bel</h2>
  <table>
    <thead>
      <tr>
        <th>Waktu</th>
        <th>Keterangan</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="scheduleTable"></tbody>
  </table>

  <audio id="bell" controls hidden></audio>
  
    <button onclick="syncSchedule()">Sync Jadwal</button>
  <button onclick="downloadSchedule()">Unduh Jadwal</button>
<button onclick="downloadAllAudio()">Unduh Semua Audio</button>
  <button onclick="syncAudio()">Sync Audio</button>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker terdaftar"))
        .catch(err => console.error("SW gagal:", err));
    }
  </script>
</body>
</html>
