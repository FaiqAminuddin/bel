<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bel Sekolah Online</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    #clock { font-size: 48px; margin-bottom: 20px; }
    table { border-collapse: collapse; margin:auto; }
    th, td { border:1px solid #ccc; padding:8px; }
  </style>
</head>
<body>
  <h1>Jam WIB Terkini</h1>
  <div id="clock"></div>
  <h2>Manajemen Data</h2>
<div id="panel" style="border:1px solid #ccc; padding:20px; margin:20px;">

  <!-- Jadwal -->
  <h3>Jadwal</h3>
  <button id="btnSyncJadwal" onclick="syncSchedule()" style="background-color:#f44336; color:white;">Sync Jadwal</button>
  <button id="btnUnduhJadwal" onclick="downloadSchedule()" style="background-color:#f44336; color:white;">Unduh Jadwal</button>
  <div id="statusJadwal" style="margin:10px; font-weight:bold; color:green;"></div>

  <!-- Audio -->
  <h3>Audio</h3>
  <button id="btnSyncAudio" onclick="syncAudio()" style="background-color:#f44336; color:white;">Sync Audio</button>
  <button id="btnUnduhAudio" onclick="downloadAllAudio()" style="background-color:#f44336; color:white;">Unduh Semua Audio</button>
  <div id="statusAudio" style="margin:10px; font-weight:bold; color:green;"></div>

</div>


  <h2>Jadwal Bel</h2>
  <table>
    <thead>
      <tr>
        <th>Waktu</th>
        <th>Keterangan</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="scheduleTable"></tbody>
  </table>

  <audio id="bell" controls hidden></audio>
  

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker terdaftar"))
        .catch(err => console.error("SW gagal:", err));
    }
  </script>
</body>
</html>
