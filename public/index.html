<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Bel Sekolah - Kontrol Terpusat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🔔 Sistem Bel Sekolah</h1>
                <p class="subtitle">Kontrol Terpusat untuk Ruangan/Gedung Terpisah</p>
            </div>
            <div class="time-display">
                <div class="wib-time" id="wibTime">--:-- WIB</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab-button active" data-tab="list">
                    📋 Daftar Bel
                </button>
                <button class="tab-button" data-tab="add">
                    ➕ Tambah Bel
                </button>
            </div>

            <!-- Tab: Daftar Bel -->
            <div id="list-tab" class="tab-content active">
                <div class="bells-container" id="bellsList">
                    <div class="loading">Memuat data bel...</div>
                </div>
            </div>

            <!-- Tab: Tambah Bel -->
            <div id="add-tab" class="tab-content">
                <form id="addBellForm" class="form-container">
                    <h2>Tambah Bel Baru</h2>

                    <!-- Nama Bel -->
                    <div class="form-group">
                        <label for="bellName">Nama Bel <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="bellName" 
                            name="name" 
                            placeholder="Contoh: Bel Masuk, Bel Istirahat, dll"
                            required
                        >
                    </div>

                    <!-- Waktu -->
                    <div class="form-group">
                        <label for="bellTime">Waktu (Jam) <span class="required">*</span></label>
                        <input 
                            type="time" 
                            id="bellTime" 
                            name="time"
                            required
                        >
                    </div>

                    <!-- Hari-hari -->
                    <div class="form-group">
                        <label>Hari <span class="required">*</span></label>
                        <div class="days-grid">
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Senin"> Senin
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Selasa"> Selasa
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Rabu"> Rabu
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Kamis"> Kamis
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Jumat"> Jumat
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Sabtu"> Sabtu
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="days" value="Minggu"> Minggu
                            </label>
                        </div>
                    </div>

                    <!-- Audio File -->
                    <div class="form-group">
                        <label for="audioFile">File Audio <span class="required">*</span></label>
                        <div class="audio-selection">
                            <select id="audioFile" name="audio" required>
                                <option value="">-- Pilih File Audio --</option>
                            </select>
                            <button type="button" class="btn-secondary" id="refreshAudio">🔄 Refresh</button>
                        </div>
                        <p class="form-hint">File audio harus berada di folder <code>/audio</code> dengan format .mp3, .wav, .ogg, atau .m4a</p>
                    </div>

                    <!-- Aktif/Tidak Aktif -->
                    <div class="form-group">
                        <label class="checkbox-label checkbox-large">
                            <input type="checkbox" id="bellActive" name="active" checked>
                            ✓ Bel Aktif
                        </label>
                    </div>

                    <!-- Tombol Submit -->
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">💾 Simpan Bel</button>
                        <button type="reset" class="btn-secondary">🔄 Reset Form</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Modal untuk Edit Bel -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Bel</h2>
                <button class="close-button" id="closeEditModal">&times;</button>
            </div>
            <form id="editBellForm" class="form-container">
                <input type="hidden" id="editBellId">

                <div class="form-group">
                    <label for="editBellName">Nama Bel <span class="required">*</span></label>
                    <input type="text" id="editBellName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="editBellTime">Waktu (Jam) <span class="required">*</span></label>
                    <input type="time" id="editBellTime" name="time" required>
                </div>

                <div class="form-group">
                    <label>Hari <span class="required">*</span></label>
                    <div class="days-grid">
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Senin"> Senin
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Selasa"> Selasa
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Rabu"> Rabu
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Kamis"> Kamis
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Jumat"> Jumat
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Sabtu"> Sabtu
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="edit-days" value="Minggu"> Minggu
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="editAudioFile">File Audio <span class="required">*</span></label>
                    <select id="editAudioFile" name="audio" required>
                        <option value="">-- Pilih File Audio --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="checkbox-label checkbox-large">
                        <input type="checkbox" id="editBellActive" name="active">
                        ✓ Bel Aktif
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Simpan Perubahan</button>
                    <button type="button" class="btn-secondary" id="cancelEditModal">❌ Batal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
